<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Room Booking Service</title>
  <desc id="desc">Клиент обращается к HTTP API на Gin, затем к usecase, PostgreSQL repository и PostgreSQL. Usecase также использует адаптеры JWT, bcrypt, refresh token и генератора ссылок. Отдельный сервис уведомлений и Kafka запланированы.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#334155"/>
    </marker>
    <marker id="planned-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#977136"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #17263c; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #526176; }
      .section { font-size: 16px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 13px; fill: #44546b; text-anchor: middle; }
      .small { font-size: 12px; fill: #526176; text-anchor: middle; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .planned-flow { fill: none; stroke: #977136; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#planned-arrow); }
    </style>
  </defs>

  <rect width="1220" height="760" fill="#ffffff"/>
  <text x="38" y="46" class="title">Room Booking Service</text>
  <text x="38" y="70" class="subtitle">Текущая архитектура и запланированное расширение</text>
  <path d="M 887 48 H 939" class="flow"/>
  <text x="950" y="52" class="subtitle">реализовано</text>
  <path d="M 1040 48 H 1092" class="planned-flow"/>
  <text x="1102" y="52" class="subtitle">в планах</text>

  <rect x="226" y="105" width="955" height="466" rx="18" fill="#fbfcff" stroke="#bdcbe0" stroke-width="1.5"/>
  <text x="251" y="135" class="section">Go-сервис · локальный запуск через Docker Compose</text>

  <rect x="38" y="269" width="142" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="109" y="314" class="label">Клиент</text>

  <rect x="270" y="225" width="201" height="164" rx="15" fill="#e7f2e5" stroke="#79a66e" stroke-width="1.6"/>
  <text x="370" y="262" class="label">HTTP API</text>
  <text x="370" y="291" class="detail">Gin · handlers</text>
  <text x="370" y="317" class="detail">Auth · роли · лимиты</text>
  <text x="370" y="343" class="detail">logging · recovery</text>

  <rect x="535" y="225" width="234" height="164" rx="15" fill="#e5efff" stroke="#7194c6" stroke-width="1.6"/>
  <text x="652" y="262" class="label">Usecase</text>
  <text x="652" y="293" class="detail">auth · room · schedule</text>
  <text x="652" y="318" class="detail">slot · booking</text>
  <text x="652" y="350" class="small">бизнес-правила и авторизация</text>

  <rect x="832" y="176" width="174" height="104" rx="15" fill="#e5efff" stroke="#7194c6" stroke-width="1.6"/>
  <text x="919" y="216" class="label">Repository</text>
  <text x="919" y="242" class="detail">pgx · SQLC · транзакции</text>

  <rect x="1047" y="192" width="99" height="78" fill="#eee5f4" stroke="#9e7bb1" stroke-width="1.5"/>
  <ellipse cx="1096.5" cy="192" rx="49.5" ry="12" fill="#f6effa" stroke="#9e7bb1" stroke-width="1.5"/>
  <path d="M 1047 270 A 49.5 12 0 0 0 1146 270" fill="none" stroke="#9e7bb1" stroke-width="1.5"/>
  <text x="1096.5" y="230" class="detail">PostgreSQL</text>

  <rect x="832" y="341" width="314" height="105" rx="15" fill="#f1effa" stroke="#9888bc" stroke-width="1.6"/>
  <text x="989" y="377" class="label">Infra-адаптеры</text>
  <text x="989" y="406" class="detail">JWT · bcrypt · refresh token</text>
  <text x="989" y="428" class="detail">генератор ссылок</text>

  <rect x="1047" y="479" width="99" height="54" rx="12" fill="#f8fafc" stroke="#8a9bb2" stroke-width="1.4"/>
  <text x="1096.5" y="511" class="detail">Goose</text>

  <path d="M 180 307 H 270" class="flow"/>
  <text x="224" y="294" class="small">HTTP</text>
  <path d="M 471 307 H 535" class="flow"/>
  <path d="M 769 273 H 797 V 228 H 832" class="flow"/>
  <path d="M 1006 228 H 1047" class="flow"/>
  <path d="M 769 344 H 801 V 393 H 832" class="flow"/>
  <path d="M 1096 479 V 284" class="flow"/>
  <text x="1060" y="464" class="small">миграции</text>

  <rect x="226" y="612" width="955" height="112" rx="18" fill="#fffbf3" stroke="#c9a66d" stroke-width="1.7" stroke-dasharray="8 6"/>
  <text x="251" y="640" class="section">Планируется · асинхронные уведомления</text>
  <rect x="594" y="656" width="174" height="46" rx="11" fill="#fff4df" stroke="#c69b50" stroke-width="1.5"/>
  <text x="681" y="685" class="detail">Kafka</text>
  <rect x="864" y="656" width="247" height="46" rx="11" fill="#fff4df" stroke="#c69b50" stroke-width="1.5"/>
  <text x="987" y="685" class="detail">Сервис уведомлений</text>
  <path d="M 652 389 V 579 H 681 V 656" class="planned-flow"/>
  <path d="M 768 679 H 864" class="planned-flow"/>
</svg>
