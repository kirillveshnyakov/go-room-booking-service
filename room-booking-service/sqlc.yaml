version: "2"

sql:
  - engine: "postgresql"
    schema: "db/migrations/schemes"
    queries: "db/queries"

    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/postgres/sqlcgen"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"