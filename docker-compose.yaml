services:
  postgres:
    image: postgres:17
    container_name: meeting_rooms_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_rooms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
