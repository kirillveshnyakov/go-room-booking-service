services:
  postgres-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_DB: room_booking_test
      POSTGRES_USER: room_booking_test
      POSTGRES_PASSWORD: local_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_booking_test -d room_booking_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  go-tests:
    image: golang:1.26.4
    profiles: ["test"]
    working_dir: /src
    volumes:
      - ./room-booking-service:/src:ro
    environment:
      GOPROXY: "off"
      TEST_DATABASE_URL: postgres://room_booking_test:local_test_password@postgres-test:5432/room_booking_test?sslmode=disable
    command: ["go", "test", "-v", "./...", "-count=1"]

  postgres:
    image: postgres:17
    container_name: meeting_rooms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_rooms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./room-booking-service
      dockerfile: Dockerfile
    image: room-booking-service:local
    entrypoint: ["/usr/local/bin/migrate"]
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_rooms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./room-booking-service
      dockerfile: Dockerfile
    image: room-booking-service:local
    restart: unless-stopped
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_rooms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_ENVIRONMENT: ${LOGGER_ENVIRONMENT:-development}
      LOGGER_SERVICE: ${LOGGER_SERVICE:-room-booking-service}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me-please}
      ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-room-booking-service}
      ACCESS_TOKEN_AUDIENCE: ${ACCESS_TOKEN_AUDIENCE:-room-booking-api}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      ENABLE_DUMMY_LOGIN: ${ENABLE_DUMMY_LOGIN:-true}
      CONFERENCE_BASE_URL: ${CONFERENCE_BASE_URL:-https://meet.example.com}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
